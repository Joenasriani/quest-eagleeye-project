name: Legacy metadata cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/legacy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and enrich legacy page metadata
        run: |
          sed -i 's/Project EagleEye: Academic Research Paper/Project EagleEye: Mixed-Reality Systems Research/g' index.html
          if ! grep -q 'rel="canonical"' index.html; then
            sed -i '/<meta name="viewport"/a\    <meta name="author" content="Joe Nasr">\n    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">\n    <link rel="canonical" href="https://joenasriani.github.io/quest-eagleeye-project/">' index.html
          fi
      - name: Commit change
        run: |
          git config user.name "Joe Nasr Research Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Complete legacy project search metadata cleanup"
          git push
