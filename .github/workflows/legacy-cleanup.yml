name: Legacy metadata cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/legacy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix legacy page wording
        run: |
          sed -i 's/Project EagleEye: Academic Research Paper/Project EagleEye: Mixed-Reality Systems Research/g' index.html
      - name: Commit change
        run: |
          git config user.name "Joe Nasr Research Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove legacy academic-paper overclaim"
          git push
