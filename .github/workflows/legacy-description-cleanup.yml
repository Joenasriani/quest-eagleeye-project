name: Legacy description cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/legacy-description-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct legacy description
        run: |
          sed -i 's#Design and Implementation of a Low-Cost, COTS-Based Augmented Reality Situational Awareness System#Joe Nasr research on Meta Quest 3, thermal imaging, LoRa/Meshtastic, gaze interaction and low-cost wearable mixed-reality systems.#g' index.html
      - name: Commit change
        run: |
          git config user.name "Joe Nasr Research Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Correct legacy EagleEye search description"
          git push
