name: QEE Phase 10 .NET 8 verification
on:
  push:
    branches: [test/qee-dotnet8-phase10]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inspect compiler
        run: dotnet --info
      - name: Require actual receiver sources
        run: |
          test -s phase10/Assets/Scripts/QeeWireProtocol.cs
          test -s phase10/Assets/Scripts/QeeThermalReceiver.cs
          test -s phase10/desktop_harness/Qee.Desktop.csproj
      - name: Compile real Phase 10 sources
        run: dotnet build phase10/desktop_harness/Qee.Desktop.csproj --configuration Release --nologo
      - name: Run compiled integration suite
        run: python3 phase10/desktop_harness/run_compiled_integration.py
      - name: Validate Phase 12 Unity candidate structure (not Unity execution)
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib
          p=pathlib.Path("phase12")
          for name in ("Packages/manifest.json","ProjectSettings/ProjectVersion.txt","Assets/Scripts/QeeWireProtocol.cs","Assets/Scripts/QeeThermalReceiver.cs","Assets/Tests/PlayMode/QeeReceiverPlayModeTests.cs","Assets/Editor/QuestEagleEyeBuildGate.cs","Assets/Editor/Phase12SceneCreator.cs","Assets/Scripts/QuestEagleEye.Runtime.asmdef","Assets/Tests/PlayMode/QuestEagleEye.PlayModeTests.asmdef"):
            assert (p/name).is_file(),name
          for name in ("QeeWireProtocol.cs","QeeThermalReceiver.cs"):
            assert (p/"Assets/Scripts"/name).read_bytes()==(pathlib.Path("phase10/Assets/Scripts")/name).read_bytes(),name
          manifest=json.loads((p/"Packages/manifest.json").read_text())
          assert "com.unity.test-framework" in manifest["dependencies"]
          for name in ("QuestEagleEye.Runtime.asmdef","QuestEagleEye.PlayModeTests.asmdef"):
            json.loads(next((p/"Assets").rglob(name)).read_text())
          print("PHASE12_STRUCTURE_PASS (Unity runtime NOT TESTED)")
          PY
      - name: Validate zero-cost Unity local-runner script (NOT Unity execution)
        run: |
          bash -n phase12/tools/run-local-unity-playmode.sh
          set +e
          UNITY_EDITOR= bash phase12/tools/run-local-unity-playmode.sh > /tmp/qee-unity-local-gate.out 2>&1
          result=$?
          set -e
          cat /tmp/qee-unity-local-gate.out
          if [ "$result" -ne 3 ]; then
            echo "::error::Expected fail-closed missing Unity Editor exit 3; got $result"
            exit 1
          fi
          echo "UNITY_LOCAL_GATE_MISSING_EDITOR_PASS (Unity was NOT executed)"
      - name: Validate Phase 13 bundle and Unity native test candidates (NOT Unity execution)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("phase12")
          test=(p/"Assets/Tests/PlayMode/QeeReceiverPlayModeTests.cs").read_text()
          shell=(p/"tools/run-local-unity-playmode.sh").read_text()
          assert "Time.realtimeSinceStartup" in test
          assert "finally { listener.Stop()" in test
          assert 'rm -f "$ROOT/phase13-evidence/playmode-results.xml"' in shell
          assert (p/"PHASE13_UNITY_HUB_TEST_BUNDLE.md").exists()
          print("PHASE13_BUNDLE_SOURCE_GATE_PASS (Unity runtime NOT TESTED)")
          PY
